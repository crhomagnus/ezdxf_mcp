name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Install project
        run: python -m pip install -e ".[all,dev]"

      - name: Run tests
        env:
          EZDXF_MCP_WORKSPACE: ${{ github.workspace }}/dxf-workspace
        run: pytest -q

      - name: Run Ruff
        run: ruff check src tests

      - name: Run mypy
        run: mypy src

      - name: Build distributions
        run: python -m build

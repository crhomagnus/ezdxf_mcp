Host ezdxf-vm
    HostName vm.example.com
    Port 22
    User ezdxf-tunnel
    IdentityFile /var/lib/ezdxf-tunnel/.ssh/id_ed25519
    IdentitiesOnly yes
    UserKnownHostsFile /var/lib/ezdxf-tunnel/.ssh/known_hosts
    StrictHostKeyChecking yes
    BatchMode yes
    ExitOnForwardFailure yes
    ServerAliveInterval 30
    ServerAliveCountMax 3
    ConnectTimeout 10
    LocalForward 127.0.0.1:8766 127.0.0.1:8766
    RemoteForward 127.0.0.1:3472 127.0.0.1:3472
    RequestTTY no
    SessionType none
